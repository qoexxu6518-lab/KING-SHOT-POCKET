<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KING SHOT 付费逻辑与礼包体系 · 时间轴</title>
  <style>
    :root {
      --bg: #f5f1e6;
      --bg-soft: #fbf6e9;
      --panel: #ffffff;
      --panel-soft: #fdf6e3;
      --line: #e3d6b3;
      --line-strong: #c8b783;
      --text: #322a1a;
      --text-soft: #5a4d2f;
      --muted: #877552;
      --muted-2: #b09a6c;
      --brand: #d97706;
      --brand-soft: #f4b860;
      --header-bg: #d9b070;
      --header-bg-strong: #c89a52;
      --row-alt: #fbf3df;
      --row-band: #efe4c7;
      --today: rgba(94, 200, 199, 0.35);
      --shadow: 0 8px 22px rgba(80, 60, 20, 0.10);
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --bar-h: 30px;
      --row-h: 44px;
      --label-w: 200px;
      --col-w: 56px;
      --bar-yellow-1: #ffd874;
      --bar-yellow-2: #f6b53a;
      --bar-orange-1: #ffb15a;
      --bar-orange-2: #f08236;
      --bar-blue-1: #6fc4ff;
      --bar-blue-2: #2d83d6;
      --bar-green-1: #8ee07c;
      --bar-green-2: #4ba33a;
      --bar-purple-1: #c69bff;
      --bar-purple-2: #8a4ed3;
      --bar-red-1: #ff7a6a;
      --bar-red-2: #c93020;
      --bar-teal-1: #8de4d4;
      --bar-teal-2: #2da897;
      --bar-white-1: #f0ece0;
      --bar-white-2: #c4b990;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(244, 184, 96, 0.22), transparent 38%),
        radial-gradient(circle at 90% 8%, rgba(45, 168, 151, 0.10), transparent 36%),
        var(--bg);
    }

    button { cursor: pointer; font: inherit; color: inherit; }

    .app-shell {
      width: min(1480px, calc(100vw - 24px));
      margin: 0 auto;
      padding: 22px 0 56px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 16px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .topbar h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -0.01em;
    }

    .topbar .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .legend-item, .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--text-soft);
      font-size: 12px;
      white-space: nowrap;
    }

    .legend-swatch {
      width: 14px;
      height: 10px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--bar-yellow-1), var(--bar-yellow-2));
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .swatch-white  { background: linear-gradient(180deg, var(--bar-white-1),  var(--bar-white-2));  border: 1px solid #b09a6c; }
    .swatch-green  { background: linear-gradient(180deg, var(--bar-green-1),  var(--bar-green-2)); }
    .swatch-yellow { background: linear-gradient(180deg, var(--bar-yellow-1), var(--bar-yellow-2)); }
    .swatch-orange { background: linear-gradient(180deg, var(--bar-orange-1), var(--bar-orange-2)); }
    .swatch-red    { background: linear-gradient(180deg, var(--bar-red-1),    var(--bar-red-2)); }
    .swatch-blue   { background: linear-gradient(180deg, var(--bar-blue-1),   var(--bar-blue-2)); }
    .swatch-purple { background: linear-gradient(180deg, var(--bar-purple-1), var(--bar-purple-2)); }
    .swatch-teal   { background: linear-gradient(180deg, var(--bar-teal-1),   var(--bar-teal-2)); }

    /* ======= Gantt 容器 ======= */
    .gantt-wrap {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .gantt-scroll {
      overflow: auto;
      max-height: calc(100vh - 140px);
      cursor: grab;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .gantt-scroll::-webkit-scrollbar { display: none; }
    .gantt-scroll.is-dragging {
      cursor: grabbing;
      user-select: none;
    }
    .gantt-scroll.is-dragging * { pointer-events: none; }

    .gantt {
      display: grid;
      grid-template-columns: var(--label-w) 1fr;
      min-width: calc(var(--label-w) + var(--col-w) * 100);
    }

    /* —— 顶部日期轴 —— */
    .gantt-corner {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 6;
      padding: 10px 14px;
      background: var(--header-bg);
      border-right: 1px solid var(--header-bg-strong);
      border-bottom: 1px solid var(--header-bg-strong);
      color: #3a2a08;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .day-axis {
      position: sticky;
      top: 0;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(100, var(--col-w));
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-bg-strong);
    }

    .day-cell {
      height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #3a2a08;
      border-right: 1px solid rgba(120, 80, 20, 0.18);
      font-size: 12px;
      line-height: 1.2;
    }

    .day-cell strong {
      font-size: 14px;
      letter-spacing: -0.02em;
    }

    .day-cell.week-start {
      border-right-color: rgba(80, 50, 10, 0.32);
    }

    /* 周末 / 每7天高亮 */
    .day-cell.is-weekly {
      background: rgba(255, 255, 255, 0.18);
    }

    /* —— 行（左侧标签 + 右侧网格） —— */
    .row-label {
      position: sticky;
      left: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      height: var(--row-h);
      background: var(--panel);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
    }

    .row-label .row-icon {
      width: 22px;
      height: 22px;
      flex: none;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
      background: var(--bar-orange-2);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .row-grid {
      position: relative;
      height: var(--row-h);
      display: grid;
      grid-template-columns: repeat(100, var(--col-w));
      border-bottom: 1px solid var(--line);
    }

    .row-grid.alt { background: var(--row-alt); }

    .grid-cell {
      border-right: 1px dashed rgba(160, 130, 70, 0.18);
    }
    .grid-cell.week-start { border-right-style: solid; border-right-color: rgba(120, 80, 20, 0.20); }

    /* —— 分组段头 —— */
    .group-header-label,
    .group-header-grid {
      height: 32px;
      background: linear-gradient(180deg, #f0c777, #e3a94f);
      border-bottom: 1px solid var(--header-bg-strong);
      border-top: 1px solid #b78b3d;
      color: #3a2a08;
      font-weight: 800;
      font-size: 13px;
    }

    .group-header-label {
      position: sticky;
      left: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-right: 1px solid var(--header-bg-strong);
    }

    .group-header-label::before {
      content: "";
      width: 4px;
      height: 16px;
      background: #fff7e0;
      border-radius: 2px;
    }

    .group-header-grid {
      display: grid;
      grid-template-columns: repeat(100, var(--col-w));
    }

    /* —— 甘特条 —— */
    .bar {
      position: relative;
      grid-row: 1;
      align-self: center;
      height: var(--bar-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px 0 8px;
      border-radius: 4px;
      color: #2c1f06;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      border: none;
      text-align: left;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: filter 0.15s ease, transform 0.15s ease;
      /* 箭头形状 */
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%);
    }

    .bar:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .bar.color-white  { background: linear-gradient(180deg, var(--bar-white-1), var(--bar-white-2)); color: #3d3520; border: 1.5px dashed #b09a6c; }
    .bar.color-green  { background: linear-gradient(180deg, var(--bar-green-1),  var(--bar-green-2));  color: #0f2c08; }
    .bar.color-yellow { background: linear-gradient(180deg, var(--bar-yellow-1), var(--bar-yellow-2)); }
    .bar.color-orange { background: linear-gradient(180deg, var(--bar-orange-1), var(--bar-orange-2)); color: #2a1a04; }
    .bar.color-red    { background: linear-gradient(180deg, var(--bar-red-1),    var(--bar-red-2));    color: #fff; }
    .bar.color-blue   { background: linear-gradient(180deg, var(--bar-blue-1),   var(--bar-blue-2));   color: #08233e; }
    .bar.color-purple { background: linear-gradient(180deg, var(--bar-purple-1), var(--bar-purple-2)); color: #f5edff; }
    .bar.color-teal   { background: linear-gradient(180deg, var(--bar-teal-1),   var(--bar-teal-2));   color: #052420; }

    .bar .bar-icon {
      width: 22px;
      height: 22px;
      flex: none;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b3d04;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }

    .bar .bar-days {
      margin-left: auto;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      color: #3a2a08;
      font-size: 10.5px;
      font-weight: 700;
    }

    /* —— 浮动“今天”竖条 —— */
    .today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--col-w);
      background: var(--today);
      pointer-events: none;
      z-index: 1;
    }

    /* ======= Modal ======= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(40, 30, 15, 0.45);
      backdrop-filter: blur(6px);
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(980px, 100%);
      max-height: min(90vh, 940px);
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 30px 60px rgba(50, 35, 10, 0.25);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }
    .modal-title-wrap { display: grid; gap: 10px; }
    .modal-title {
      margin: 0;
      font-size: clamp(20px, 2.4vw, 28px);
      letter-spacing: -0.02em;
    }
    .close-btn {
      flex: none;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--panel);
      font-size: 22px;
      line-height: 1;
    }
    .close-btn:hover { border-color: #b91c1c; color: #b91c1c; }
    .modal-body {
      display: grid;
      grid-template-columns: minmax(0, 240px) minmax(0, 1fr);
      gap: 18px;
      max-height: calc(min(90vh, 940px) - 104px);
      overflow: auto;
      padding: 20px 22px 24px;
    }
    .modal-body.no-gallery { grid-template-columns: 1fr; }

    .gallery {
      display: grid;
      gap: 10px;
      align-content: start;
      padding-right: 14px; /* 预留给堆叠旋转的边距，避免压右文 */
    }
    .gallery-card {
      position: relative;
      width: 100%;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #1f1a12;
      cursor: zoom-in;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: block;
    }
    .gallery-card img {
      display: block;
      width: 100%;
      max-height: min(72vh, 760px);
      height: auto;
      object-fit: contain;
    }
    .gallery-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(80, 50, 10, 0.18);
    }

    .gallery-stack {
      position: relative;
      width: 100%;
      cursor: zoom-in;
      padding: 0;
      background: none;
      border: 0;
      display: block;
    }
    .gallery-stack .stack-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #1f1a12;
      box-shadow: 0 6px 18px rgba(80, 50, 10, 0.15);
      transform-origin: center bottom;
      transition: transform 0.25s ease;
    }
    .gallery-stack .stack-card img {
      display: block;
      width: 100%;
      max-height: min(68vh, 720px);
      height: auto;
      object-fit: contain;
    }
    .gallery-stack .stack-card.s-front {
      position: relative;
      z-index: 3;
    }
    .gallery-stack .stack-card.s-back-1,
    .gallery-stack .stack-card.s-back-2 {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .gallery-stack .stack-card.s-back-2 {
      transform: translate(8px, 8px) rotate(2.5deg);
      filter: brightness(0.9);
      z-index: 1;
    }
    .gallery-stack .stack-card.s-back-1 {
      transform: translate(4px, 4px) rotate(1.5deg);
      filter: brightness(0.95);
      z-index: 2;
    }
    .gallery-stack:hover .stack-card.s-back-2 {
      transform: translate(12px, 12px) rotate(4deg);
    }
    .gallery-stack:hover .stack-card.s-back-1 {
      transform: translate(6px, 6px) rotate(2.5deg);
    }
    .gallery-stack .stack-badge {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 4;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .gallery-hint {
      text-align: center;
      color: var(--muted);
      font-size: 11.5px;
      letter-spacing: 0.02em;
    }

    .info-col { display: grid; gap: 12px; align-content: start; }

    .detail-box {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--panel-soft);
    }
    .detail-box h4 {
      margin: 0 0 8px;
      font-size: 13px;
      color: #92400e;
      letter-spacing: 0.02em;
    }
    .detail-box p {
      margin: 0;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.75;
      white-space: pre-line;
    }
    .item-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .item-list li {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-soft);
      color: var(--text-soft);
      font-size: 12px;
    }

    .note-box {
      padding: 14px 16px;
      border: 1.5px dashed #d4a855;
      border-radius: var(--radius-md);
      background: #fffbf0;
    }
    .note-box h4 {
      margin: 0 0 8px;
      font-size: 13px;
      color: #b45309;
      letter-spacing: 0.02em;
    }
    .note-box p {
      margin: 0;
      color: #78716c;
      font-size: 13px;
      line-height: 1.75;
      white-space: pre-line;
      font-style: italic;
    }

    .level-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr 1fr;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--line);
      font-size: 12.5px;
    }
    .level-grid-head {
      display: contents;
    }
    .level-grid-head > span {
      padding: 6px 10px;
      background: var(--row-band);
      color: var(--text-soft);
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: 0.03em;
    }
    .level-grid-row {
      display: contents;
    }
    .level-grid-row > span {
      padding: 5px 10px;
      border-top: 1px solid var(--line);
      color: var(--text);
    }
    .level-grid-row:nth-child(odd) > span {
      background: var(--bg-soft);
    }
    .level-grid-row > span:last-child {
      color: #b45309;
      font-weight: 600;
    }

    /* ===== Lightbox ===== */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      background: rgba(10, 8, 4, 0.9);
    }
    .lightbox.open { display: block; }
    .lightbox-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .lightbox-stage.is-dragging { cursor: grabbing; }
    .lightbox-img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: auto;
      height: auto;
      max-width: 88vw;
      max-height: 84vh;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      will-change: transform;
      pointer-events: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      border-radius: 6px;
    }
    .lightbox-toolbar {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }
    .lightbox-toolbar button,
    .lightbox-nav button {
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 14px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }
    .lightbox-toolbar button:hover,
    .lightbox-nav button:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.45);
    }
    .lightbox-counter {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
    }
    .lightbox-nav {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 2;
    }
    .lightbox-nav[hidden] { display: none; }
    .lightbox-hint {
      position: absolute;
      bottom: 22px;
      right: 18px;
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.78);
      font-size: 11.5px;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
    }

    /* ===== 图集全屏陈列 ===== */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 180;
      display: none;
      background: rgba(10, 8, 4, 0.88);
      overflow: auto;
      padding: 70px 40px 60px;
    }
    .grid-overlay.open { display: block; }
    .grid-overlay-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
      color: #fff;
      z-index: 2;
    }
    .grid-overlay-header h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .grid-overlay-header .meta {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;

      display: flex;

      aspect-ratio: 9 / 19;
      border-radius: 10px;
      overflow: hidden;
      background: #1f1a12;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.2s ease, border-color 0.2s ease;

    .grid-cell:hover .grid-cell-image {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.4);
    }
    .grid-cell-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
    .grid-cell-caption {
      color: rgba(255, 255, 255, 0.88);
      font-size: 13px;
      text-align: center;
      letter-spacing: 0.02em;
      word-break: break-all;

      margin: 14px 4px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .budget-row-cells {

    .budget-cell {

    function imgSrc(path) {
      // 把相对路径编码成浏览器可识别的 URL（处理中文目录）
      return encodeURI(path);
    }

    function imgName(path) {
      const base = path.split(/[\\/]/).pop() || path;
      return base.replace(/\.[^.]+$/, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function dayText(item) {
      return item.startDay === item.endDay ? `D${item.startDay}` : `D${item.startDay}-D${item.endDay}`;
    }

    function clampDay(d) {
      return Math.max(1, Math.min(TOTAL_DAYS, d));
    }

    function renderDayAxis() {
      const cells = [];
      for (let d = 1; d <= TOTAL_DAYS; d += 1) {
        const isWeekStart = (d - 1) % 7 === 0;
        const isWeekly = Math.floor((d - 1) / 7) % 2 === 0;
        cells.push(`
          <div class="day-cell ${isWeekStart ? "week-start" : ""} ${isWeekly ? "is-weekly" : ""}">
            <strong>D${d}</strong>
            <span>第 ${Math.floor((d - 1) / 7) + 1} 周</span>
          </div>
        `);
      }
      return `
        <div class="gantt-corner">📅 服务器开服天数</div>
        <div class="day-axis">${cells.join("")}</div>
      `;
    }

    function renderGridCells(extraClass = "") {
      const cells = [];
      for (let d = 1; d <= TOTAL_DAYS; d += 1) {
        const isWeekStart = (d - 1) % 7 === 0;
        cells.push(`<div class="grid-cell ${isWeekStart ? "week-start" : ""}"></div>`);
      }
      return `<div class="row-grid ${extraClass}">${cells.join("")}</div>`;
    }

    function renderBar(item) {
      const start = clampDay(item.startDay);
      const end = clampDay(item.endDay);
      const colStart = start;
      const colEnd = end + 1; // grid line
      return `
        <button class="bar color-${escapeHtml(item.color || "yellow")}"
                style="grid-column: ${colStart} / ${colEnd};"
                data-item-id="${escapeHtml(item.id)}"
                title="${escapeHtml(item.title)} (${dayText(item)})">
          <span class="bar-icon">${escapeHtml(item.icon || "·")}</span>
          <span class="bar-title">${escapeHtml(item.title)}</span>
          <span class="bar-days">${escapeHtml(dayText(item))}</span>
        </button>
      `;
    }

    function renderRow(item, alt) {
      // 行 = 左侧 label + 右侧 grid（grid 内放 bar）
      return `
        <div class="row-label">
          <span class="row-icon" style="background: var(--bar-${item.color || "yellow"}-2);">${escapeHtml(item.icon || "·")}</span>
          <span>${escapeHtml(item.title)}</span>
        </div>
        <div class="row-grid ${alt ? "alt" : ""}">
          ${gridCellsHtml}
          ${renderBar(item)}
        </div>
      `;
    }

    (function buildGridCells() {

      }
      gridCellsHtml = arr.join("");
    })();

          breakdown[i].push({ label, amt });
        }
        return { spend, breakdown, add };

        const tipAttr = bk && bk.length

        const items = seedData
          .filter(it => it.group === group.id)
          .sort((a, b) => a.startDay - b.startDay);
        if (!items.length) return;

        // 分组标题行
        parts.push(`
          <div class="group-header-label">${escapeHtml(group.title)}</div>
          <div class="group-header-grid"></div>
        `);

        items.forEach(item => {
          parts.push(renderRow(item, altIndex % 2 === 1));
          altIndex += 1;
        });
      });

      // 付费分层参考行（独立渲染，每格直接显示当日金额）
      const budgetGroup = GROUPS.find(g => g.id === "budget");
      if (budgetGroup) {
        parts.push(`
          <div class="group-header-label">${escapeHtml(budgetGroup.title)}</div>
          <div class="group-header-grid"></div>
        `);
        budgetRows.forEach((item, i) => {
          parts.push(renderBudgetRow(item, i % 2 === 1));
        });
      }

      els.gantt.innerHTML = parts.join("");
    }

    let activeImages = [];
    let activeImageIndex = 0;
    let activeTitle = "";

    function renderGallery(images) {
      if (!images || !images.length) return "";
      if (images.length === 1) {
        return `
          <div class="gallery">
            <button type="button" class="gallery-card" data-action="open-single">
              <img src="${escapeHtml(imgSrc(images[0]))}" alt="" />
            </button>
            <div class="gallery-hint">点击查看大图</div>
          </div>
        `;
      }
      const cover = images[0];
      const second = images[1] || cover;
      const third = images[2] || second;
      return `
        <div class="gallery">
          <button type="button" class="gallery-stack" data-action="open-grid">
            <div class="stack-card s-back-2"><img src="${escapeHtml(imgSrc(third))}" alt="" /></div>
            <div class="stack-card s-back-1"><img src="${escapeHtml(imgSrc(second))}" alt="" /></div>
            <div class="stack-card s-front"><img src="${escapeHtml(imgSrc(cover))}" alt="" /></div>
            <span class="stack-badge">图集 · ${images.length} 张</span>
          </button>
          <div class="gallery-hint">点击展开图集</div>
        </div>
      `;
    }

    function openModal(itemId) {
      const item = seedData.find(entry => entry.id === itemId);
      if (!item) return;

      const images = Array.isArray(item.images) ? item.images : [];
      activeImages = images;
      activeImageIndex = 0;
      activeTitle = item.title;

      els.modalPills.innerHTML = `
        <span class="pill"><span class="legend-swatch swatch-${escapeHtml(item.color || "yellow")}"></span>${escapeHtml(item.title)}</span>
        <span class="pill">${escapeHtml(dayText(item))}</span>
        <span class="pill">优先级 ${escapeHtml(item.priority)}</span>
      `;
      els.modalTitle.textContent = item.title;

      const galleryHtml = renderGallery(images);
      els.modalBody.classList.toggle("no-gallery", !galleryHtml);
      els.modalBody.innerHTML = `
        ${galleryHtml}
        <div class="info-col">
          <section class="detail-box">
            <h4>一句话结论</h4>
            <p>${escapeHtml(item.summary || "待填")}</p>
          </section>
          <section class="detail-box">
            <h4>主要投放内容</h4>
            <ul class="item-list">
              ${(item.coreItems || ["待填"]).map(value => `<li>${escapeHtml(value)}</li>`).join("")}
            </ul>
          </section>
          <section class="detail-box">
            <h4>付费坑 / 玩家层级</h4>
            <p>${escapeHtml(item.cap || "待填")}</p>
          </section>
          ${item.levels ? `
          <section class="detail-box">
            <h4>VIP 升级门槛（累计消费 · 含 VIP1 起算）</h4>
            <div class="level-grid">
              <div class="level-grid-head"><span>等级</span><span>累计 Gems</span><span>估算 CNY</span><span>礼包售价</span></div>
              ${item.levels.map(lv => `<div class="level-grid-row"><span>${escapeHtml(lv.vip)}</span><span>${escapeHtml(lv.gems)}</span><span>${escapeHtml(lv.cny)}</span><span>${escapeHtml(lv.packPrice || "—")}</span></div>`).join("")}
            </div>
          </section>` : ""}
          <section class="note-box">
            <h4>✏️ 主观感受</h4>
            <p>${escapeHtml(item.note || "（尚未填写体验记录……）")}</p>
          </section>
        </div>
      `;

      els.modalBackdrop.classList.add("open");
      els.modalBackdrop.setAttribute("aria-hidden", "false");
      els.closeModalBtn.focus();
    }

    function closeModal() {
      els.modalBackdrop.classList.remove("open");
      els.modalBackdrop.setAttribute("aria-hidden", "true");
    }

    // ===== Lightbox（缩放 + 拖拽） =====
    const lb = { scale: 1, tx: 0, ty: 0, dragging: false, lastX: 0, lastY: 0 };

    function applyLbTransform() {
      els.lbImage.style.transform = `translate(calc(-50% + ${lb.tx}px), calc(-50% + ${lb.ty}px)) scale(${lb.scale})`;
    }

    function resetLbView() {
      lb.scale = 1;
      lb.tx = 0;
      lb.ty = 0;
      applyLbTransform();
    }

    function showLbImage(index) {
      if (!activeImages.length) return;
      activeImageIndex = (index + activeImages.length) % activeImages.length;
      els.lbImage.src = imgSrc(activeImages[activeImageIndex]);
      els.lbCounter.textContent = `${activeImageIndex + 1} / ${activeImages.length}`;
      els.lbNav.hidden = activeImages.length <= 1;
      resetLbView();
    }

    function openLightbox(index) {
      if (!activeImages.length) return;
      els.lightbox.classList.add("open");
      els.lightbox.setAttribute("aria-hidden", "false");
      showLbImage(index);
    }

    function closeLightbox() {
      els.lightbox.classList.remove("open");
      els.lightbox.setAttribute("aria-hidden", "true");
    }

    function openGridOverlay() {
      if (!activeImages.length) return;
      els.goTitle.textContent = activeTitle || "图集";
      els.goMeta.textContent = `共 ${activeImages.length} 张 · 点击查看大图`;
      els.goGrid.innerHTML = activeImages.map((src, i) => `
        <div class="grid-cell" data-grid-index="${i}">
          <div class="grid-cell-image"><img src="${escapeHtml(imgSrc(src))}" alt="" /></div>
          <div class="grid-cell-caption">${escapeHtml(imgName(src))}</div>
        </div>
      `).join("");
      els.gridOverlay.classList.add("open");
      els.gridOverlay.setAttribute("aria-hidden", "false");
    }

    function closeGridOverlay() {
      els.gridOverlay.classList.remove("open");
      els.gridOverlay.setAttribute("aria-hidden", "true");
    }

    function zoomBy(factor, cx, cy) {
      const newScale = Math.min(8, Math.max(0.2, lb.scale * factor));
      // 以视口中心做近似缩放（不强行实现指针中心缩放，避免与 translate(-50%,-50%) 叠加复杂）
      lb.scale = newScale;
      applyLbTransform();
    }

    function bindLightbox() {
      // 单图 → 直接 lightbox；多图 → 全屏图集陈列
      els.modalBody.addEventListener("click", event => {
        const trigger = event.target.closest("[data-action]");
        if (!trigger) return;
        if (trigger.dataset.action === "open-single") {
          openLightbox(0);
        } else if (trigger.dataset.action === "open-grid") {
          openGridOverlay();
        }
      });

      // 图集 → 点某张 → lightbox
      els.goGrid.addEventListener("click", event => {
        const cell = event.target.closest(".grid-cell");
        if (!cell) return;
        openLightbox(Number(cell.dataset.gridIndex || 0));
      });
      els.goClose.addEventListener("click", closeGridOverlay);
      els.gridOverlay.addEventListener("click", event => {
        if (event.target === els.gridOverlay) closeGridOverlay();
      });

      // 滚轮缩放
      els.lbStage.addEventListener("wheel", event => {
        event.preventDefault();
        const factor = event.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomBy(factor);
      }, { passive: false });

      // 拖拽平移
      els.lbStage.addEventListener("mousedown", event => {
        if (event.button !== 0) return;
        lb.dragging = true;
        lb.lastX = event.clientX;
        lb.lastY = event.clientY;
        els.lbStage.classList.add("is-dragging");
      });
      window.addEventListener("mousemove", event => {
        if (!lb.dragging) return;
        lb.tx += event.clientX - lb.lastX;
        lb.ty += event.clientY - lb.lastY;
        lb.lastX = event.clientX;
        lb.lastY = event.clientY;
        applyLbTransform();
      });
      window.addEventListener("mouseup", () => {
        lb.dragging = false;
        els.lbStage.classList.remove("is-dragging");
      });

      // 按钮 & 键盘
      els.lbZoomIn.addEventListener("click", () => zoomBy(1.25));
      els.lbZoomOut.addEventListener("click", () => zoomBy(1 / 1.25));
      els.lbReset.addEventListener("click", resetLbView);
      els.lbClose.addEventListener("click", closeLightbox);
      els.lbPrev.addEventListener("click", () => showLbImage(activeImageIndex - 1));
      els.lbNext.addEventListener("click", () => showLbImage(activeImageIndex + 1));

      // 点击舞台空白（非按钮）关闭
      els.lightbox.addEventListener("click", event => {
        if (event.target === els.lbStage || event.target === els.lightbox) closeLightbox();
      });

      document.addEventListener("keydown", event => {
        if (els.lightbox.classList.contains("open")) {
          if (event.key === "Escape") closeLightbox();
          else if (event.key === "ArrowLeft") showLbImage(activeImageIndex - 1);
          else if (event.key === "ArrowRight") showLbImage(activeImageIndex + 1);
          return;
        }
        if (els.gridOverlay.classList.contains("open") && event.key === "Escape") {
          closeGridOverlay();
        }
      });
    }

    function bindEvents() {
      document.addEventListener("click", event => {
        const trigger = event.target.closest("[data-item-id]");
        if (trigger) openModal(trigger.dataset.itemId);
      });
      els.closeModalBtn.addEventListener("click", closeModal);
      els.modalBackdrop.addEventListener("click", event => {
        if (event.target === els.modalBackdrop) closeModal();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape"
          && !els.lightbox.classList.contains("open")
          && !els.gridOverlay.classList.contains("open")) closeModal();
      });
    }

    function bindDragScroll() {
      const scroller = document.querySelector(".gantt-scroll");
      if (!scroller) return;
      const DRAG_THRESHOLD = 5; // px，超过才进入拖拽模式，否则视为普通点击
      let pressed = false;
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let startLeft = 0;
      let startTop = 0;

      scroller.addEventListener("mousedown", event => {
        if (event.button !== 0) return;
        pressed = true;
        dragging = false;
        startX = event.clientX;
        startY = event.clientY;
        startLeft = scroller.scrollLeft;
        startTop = scroller.scrollTop;
        // 不在 mousedown 时 preventDefault / 加 is-dragging，
        // 等真正移动超过阈值后再切到拖拽模式，避免吞掉按钮 click
      });
      window.addEventListener("mousemove", event => {
        if (!pressed) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (!dragging) {
          if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
          dragging = true;
          scroller.classList.add("is-dragging");
        }
        scroller.scrollLeft = startLeft - dx;
        scroller.scrollTop = startTop - dy;
        event.preventDefault();
      });
      window.addEventListener("mouseup", () => {
        if (!pressed) return;
        pressed = false;
        if (dragging) {
          scroller.classList.remove("is-dragging");
          // 拖拽产生的 click 拦掉，避免误打开弹窗
          const blockOnce = ev => {
            ev.stopPropagation();
            ev.preventDefault();
          };
          scroller.addEventListener("click", blockOnce, { capture: true, once: true });
          // 兜底：若浏览器不派发 click（拖出元素外），下一帧自动取消监听
          setTimeout(() => scroller.removeEventListener("click", blockOnce, { capture: true }), 0);
        }
        dragging = false;
      });
    }

    bindEvents();
    bindLightbox();
    renderGantt();
    bindDragScroll();

    // ===== 付费明细气泡 =====
    (function () {
      const tip = document.getElementById("budgetTip");
      const gantt = document.getElementById("gantt");

      gantt.addEventListener("mouseover", function (e) {
        const cell = e.target.closest("[data-tip]");
        if (!cell) return;
        const day = cell.dataset.day;
        const items = JSON.parse(cell.dataset.tip);
        const total = items.reduce((s, x) => s + x.amt, 0);
        let html = `<div class="budget-tip-day">D${day} · 消费明细</div>`;
        items.forEach(x => {
          html += `<div class="budget-tip-row"><span>${x.label}</span><span>¥${x.amt.toLocaleString()}</span></div>`;
        });
        html += `<div class="budget-tip-total">合计 ¥${total.toLocaleString()}</div>`;
        tip.innerHTML = html;
        tip.style.display = "block";
      });

      gantt.addEventListener("mousemove", function (e) {
        if (tip.style.display === "none") return;
        const ox = e.clientX + 16, oy = e.clientY + 16;
        const tw = tip.offsetWidth, th = tip.offsetHeight;
        tip.style.left = (ox + tw > window.innerWidth  ? e.clientX - tw - 10 : ox) + "px";
        tip.style.top  = (oy + th > window.innerHeight ? e.clientY - th - 10 : oy) + "px";
      });

      gantt.addEventListener("mouseout", function (e) {
        const cell = e.target.closest("[data-tip]");
        if (cell && !cell.contains(e.relatedTarget)) tip.style.display = "none";
      });
    })();
  </script>
</body>
